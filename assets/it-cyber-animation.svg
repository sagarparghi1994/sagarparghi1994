<svg width="100%" height="420"
     viewBox="0 0 900 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Neon glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber background -->
    <radialGradient id="bg">
      <stop offset="0%" stop-color="#101d35"/>
      <stop offset="100%" stop-color="#05090f"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="30"
             height="30"
             patternUnits="userSpaceOnUse">

      <path d="M30 0H0V30"
            fill="none"
            stroke="#1b3550"
            stroke-width="1"/>

    </pattern>

  </defs>


  <!-- Background -->

  <rect width="900"
        height="420"
        rx="20"
        fill="url(#bg)"/>

  <rect width="900"
        height="420"
        rx="20"
        fill="url(#grid)"
        opacity="0.45"/>


  <!-- TOP TITLE -->

  <text x="450"
        y="42"
        text-anchor="middle"
        fill="#55c7ff"
        font-family="monospace"
        font-size="24"
        font-weight="bold">

    IT OPERATIONS × CYBERSECURITY

    <animate attributeName="opacity"
             values="1;0.55;1"
             dur="3s"
             repeatCount="indefinite"/>

  </text>


  <!-- LEFT IT PANEL -->

  <g transform="translate(30 90)"
     filter="url(#glow)">

    <rect width="220"
          height="230"
          rx="15"
          fill="#071525"
          stroke="#168cff"
          stroke-width="2"/>

    <text x="110"
          y="35"
          text-anchor="middle"
          fill="#45baff"
          font-family="monospace"
          font-size="18"
          font-weight="bold">

      IT OPERATIONS

    </text>


    <!-- Server -->

    <rect x="25"
          y="55"
          width="170"
          height="40"
          rx="7"
          fill="#0b2035"
          stroke="#238cff"/>

    <text x="40"
          y="80"
          fill="#8bd7ff"
          font-family="monospace"
          font-size="13">

      🖥 SERVER

    </text>


    <!-- Cloud -->

    <rect x="25"
          y="105"
          width="170"
          height="40"
          rx="7"
          fill="#0b2035"
          stroke="#238cff"/>

    <text x="40"
          y="130"
          fill="#8bd7ff"
          font-family="monospace"
          font-size="13">

      ☁ CLOUD

    </text>


    <!-- Network -->

    <rect x="25"
          y="155"
          width="170"
          height="40"
          rx="7"
          fill="#0b2035"
          stroke="#238cff"/>

    <text x="40"
          y="180"
          fill="#8bd7ff"
          font-family="monospace"
          font-size="13">

      🌐 NETWORK

    </text>


    <!-- Automation -->

    <rect x="25"
          y="205"
          width="170"
          height="0"
          rx="7"
          fill="#0b2035"/>

  </g>


  <!-- RIGHT CYBER PANEL -->

  <g transform="translate(650 90)"
     filter="url(#glow)">

    <rect width="220"
          height="230"
          rx="15"
          fill="#061a17"
          stroke="#00e6a0"
          stroke-width="2"/>

    <text x="110"
          y="35"
          text-anchor="middle"
          fill="#00ffad"
          font-family="monospace"
          font-size="18"
          font-weight="bold">

      CYBERSECURITY

    </text>


    <!-- Shield -->

    <path d="M110 58
             L155 75
             L148 125
             Q110 155 72 125
             L65 75 Z"

          fill="none"
          stroke="#00ffad"
          stroke-width="4"/>


    <!-- Lock -->

    <rect x="94"
          y="91"
          width="32"
          height="27"
          rx="4"
          fill="none"
          stroke="#00ffad"
          stroke-width="3"/>

    <path d="M100 91
             V83
             Q110 68 120 83
             V91"

          fill="none"
          stroke="#00ffad"
          stroke-width="3"/>


    <!-- Security labels -->

    <text x="25"
          y="175"
          fill="#65ffc9"
          font-family="monospace"
          font-size="12">

      ✓ DETECT

    </text>

    <text x="25"
          y="195"
          fill="#65ffc9"
          font-family="monospace"
          font-size="12">

      ✓ ANALYZE

    </text>

    <text x="25"
          y="215"
          fill="#65ffc9"
          font-family="monospace"
          font-size="12">

      ✓ RESPOND

    </text>

  </g>


  <!-- YOUR CHARACTER -->

  <g>

    <!-- Character image -->
    <image href="sagar-it-cyber.png"
           x="280"
           y="65"
           width="340"
           height="340"
           preserveAspectRatio="xMidYMid meet"/>

    <!-- Character glow -->

    <circle cx="450"
            cy="225"
            r="155"
            fill="none"
            stroke="#159fff"
            stroke-width="2"
            opacity="0.5"
            filter="url(#glow)">

      <animate attributeName="r"
               values="145;165;145"
               dur="3s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0.3;0.8;0.3"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- DATA FLOW -->

  <g fill="#00eaff">

    <circle cx="255" cy="150" r="4">

      <animate attributeName="cx"
               values="250;640;250"
               dur="4s"
               repeatCount="indefinite"/>

    </circle>

    <circle cx="255" cy="190" r="3">

      <animate attributeName="cx"
               values="250;640;250"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- TERMINAL -->

  <rect x="300"
        y="350"
        width="300"
        height="45"
        rx="8"
        fill="#050b12"
        stroke="#00ff9d"/>

  <text x="315"
        y="378"
        fill="#00ff9d"
        font-family="monospace"
        font-size="13">

    sagar@IT:~$ secure_systems --run

    <animate attributeName="opacity"
             values="0.5;1;0.5"
             dur="2s"
             repeatCount="indefinite"/>

  </text>


  <!-- SCANNING LINE -->

  <rect x="260"
        y="65"
        width="3"
        height="270"
        fill="#00ff9d"
        opacity="0.7"
        filter="url(#glow)">

    <animate attributeName="x"
             values="260;640;260"
             dur="5s"
             repeatCount="indefinite"/>

  </rect>


  <!-- BOTTOM -->

  <text x="450"
        y="415"
        text-anchor="middle"
        fill="#71869a"
        font-family="monospace"
        font-size="11">

    BUILD • DEPLOY • MONITOR • SECURE • AUTOMATE • GROW

  </text>
     <image href="sagar-it-cyber.png"
       x="280"
       y="65"
       width="340"
       height="340"
       preserveAspectRatio="xMidYMid meet"/>

</svg>
